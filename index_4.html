<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mia stanza</title>
<style>
  :root { --green:#00ff41; --green-dim:#00b32c; --bg:#000; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#000; }
  body {
    overflow:hidden; font-family:"Courier New",Courier,monospace;
    display:flex; align-items:center; justify-content:center;
    height:100vh; height:100dvh;
  }

  /* Sfondo sfocato che riempie le bande ai lati (o sopra/sotto) */
  #bgfill {
    position:fixed; inset:-40px; background-size:cover; background-position:center;
    filter:blur(28px) brightness(.35); z-index:0;
  }

  /* La scena si adatta allo schermo intero mantenendo le proporzioni
     dell'immagine (1408x768): nessuna barra di scorrimento. */
  #scene {
    position:relative; z-index:1; flex:none;
    width:min(100vw, calc(100vh * 1408 / 768));
    height:min(100vh, calc(100vw * 768 / 1408));
    width:min(100vw, calc(100dvh * 1408 / 768));
    height:min(100dvh, calc(100vw * 768 / 1408));
    box-shadow:0 0 60px rgba(0,0,0,.8);
  }
  /* Solo su telefoni in verticale: scena a tutta altezza, scorrimento orizzontale */
  @media (orientation: portrait) and (max-width: 900px) {
    body { display:block; overflow:auto; }
    #scene { width:calc(100dvh * 1408 / 768); height:100dvh; }
  }
  #scene svg { position:absolute; inset:0; width:100%; height:100%; display:block; }

  .hot { cursor:pointer; outline:none; }
  .hot path, .hot polygon {
    fill:rgba(0,255,65,0); stroke:rgba(0,255,65,0); stroke-width:3;
    transition:fill .2s, stroke .2s; filter:none;
  }
  .hot:hover path, .hot:hover polygon,
  .hot:focus-visible path, .hot:focus-visible polygon,
  .show-all .hot path, .show-all .hot polygon {
    fill:rgba(0,255,65,.12); stroke:var(--green); filter:url(#glow);
  }
  .hot.visited path, .hot.visited polygon { }

  /* Etichetta al passaggio del mouse */
  #tip {
    position:fixed; pointer-events:none; z-index:5; display:none;
    background:rgba(0,0,0,.85); color:var(--green); border:1px solid var(--green);
    padding:4px 8px; font-size:13px; text-shadow:0 0 6px var(--green);
  }

  /* Pulsante aiuto */
  #help {
    position:fixed; right:16px; bottom:16px; z-index:6;
    background:rgba(0,0,0,.8); color:var(--green); border:1px solid var(--green);
    font:inherit; font-size:14px; padding:8px 12px; cursor:pointer;
    text-shadow:0 0 6px var(--green); box-shadow:0 0 12px rgba(0,255,65,.3);
  }
  #help:hover { background:rgba(0,40,10,.9); }

  /* Selettore lingua */
  #lang { position:fixed; top:16px; right:16px; z-index:6; display:flex; gap:8px; }
  #lang button {
    width:44px; height:30px; padding:3px; cursor:pointer;
    background:rgba(0,0,0,.75); border:1px solid var(--green-dim);
    opacity:.55; filter:grayscale(.6); transition:opacity .2s, filter .2s, box-shadow .2s;
  }
  #lang button svg { display:block; width:100%; height:100%; }
  #lang button:hover, #lang button:focus-visible { opacity:1; filter:none; outline:none; }
  #lang button[aria-pressed="true"] {
    opacity:1; filter:none; border-color:var(--green); box-shadow:0 0 12px rgba(0,255,65,.6);
  }

  /* Pioggia digitale + popup */
  #overlay {
    position:fixed; inset:0; z-index:10; display:none;
    align-items:center; justify-content:center; padding:16px;
  }
  #overlay.open { display:flex; }
  #rain { position:absolute; inset:0; width:100%; height:100%; }
  #popup {
    position:relative; width:min(640px, 100%); max-height:min(80vh, 640px);
    display:flex; flex-direction:column;
    background:rgba(0,8,2,.92); border:1px solid var(--green);
    box-shadow:0 0 30px rgba(0,255,65,.35), inset 0 0 40px rgba(0,255,65,.06);
    color:var(--green); text-shadow:0 0 5px rgba(0,255,65,.8);
    animation:boot .35s ease-out;
  }
  @keyframes boot { from { transform:scaleY(.02); opacity:0 } 60% { transform:scaleY(1.03); opacity:1 } to { transform:scaleY(1) } }
  #popup::after { /* linee di scansione */
    content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.25) 2px 3px);
  }
  #bar {
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:8px 12px; border-bottom:1px solid var(--green-dim); font-size:13px; color:var(--green-dim);
  }
  #close {
    background:none; border:1px solid var(--green-dim); color:var(--green);
    font:inherit; padding:2px 8px; cursor:pointer;
  }
  #close:hover { background:var(--green); color:#000; }
  #body { padding:16px 18px 20px; overflow-y:auto; font-size:15px; line-height:1.6; }
  #title { margin:0 0 12px; font-size:20px; letter-spacing:1px; }
  #text { white-space:pre-wrap; margin:0; }
  .cursor { display:inline-block; width:.6em; background:var(--green); animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0 } }
  #hint { padding:0 18px 12px; font-size:12px; color:var(--green-dim); }

  /* Schermata iniziale */
  #intro {
    position:fixed; inset:0; z-index:20; background:#000; color:var(--green);
    display:flex; align-items:center; justify-content:center; padding:16px;
    font-size:clamp(16px, 2.6vw, 26px); text-shadow:0 0 8px var(--green); cursor:pointer;
    transition:opacity .8s;
  }
  #intro.hide { opacity:0; pointer-events:none; }

  @media (prefers-reduced-motion: reduce) {
    #popup { animation:none; }
  }
</style>
</head>
<body>

A rock opera about isolation: every trauma is one more brick,
until the main character, Pink, finds himself walled in.
In 1982 it became a film by Alan Parker, with animations
by Gerald Scarfe.

I keep it on the wall as a reminder: walls are built
one brick at a time. Code too.` },
  darkside: { label: "Pink Floyd – The Dark Side of the Moon", title: "THE DARK SIDE OF THE MOON (1973)", text:
`A prism, a beam of light, a spectrum of colours.
Cover by Hipgnosis: no lettering, no photo of the band.

One of the best-selling albums ever, it stayed on the charts
for what feels like forever. Time, money, madness:
the same themes as a regular day at the office.

> prism.exe: white light in
> output: six colours and a masterpiece` },
  febbre: { label: "Febbre da cavallo", title: "FEBBRE DA CAVALLO (1976)", text:
`Directed by Steno. Gigi Proietti is Mandrake, Enrico Montesano is Er Pomata.

Three friends, the Tor di Valle racetrack, bets always on
the wrong horse and an unshakeable faith in the big win.
A cult classic of Italian comedy, watched until memorised.

Every Friday-afternoon deploy is a bit like betting
on a horse that has never won.` },
  frostmourne: { label: "Frostmourne", title: "FROSTMOURNE", text:
`The runeblade of the Lich King.

Arthas Menethil took it up to save his people
and ended up losing everything, soul included.
Warcraft III, then Wrath of the Lich King.

Moral of the story: always read the terms and conditions
before you accept.` },
  wow: { label: "World of Warcraft", title: "WORLD OF WARCRAFT", text:
`Azeroth. Raids until 3 a.m., guilds, loot,
"one more dungeon and then I'm off to bed".

Blizzard, 2004. For many of us it wasn't just a game
but a second home address.

For the Horde? For the Alliance?
That information is classified.` },
  elmo: { label: "The Helm of Domination", title: "HELM OF DOMINATION", text:
`The Lich King's crown, guarding the bookcase.

Whoever wears it commands the Scourge. I use it to make sure
nobody borrows my records without asking.

"There must always be a Lich King."
Even in an office.` },
  figure: { label: "Action figures", title: "ACTION FIGURES", text:
`Two plastic action heroes, on guard next to the monitors.

They don't talk, they don't comment on the code, they never ask
"how much longer is this going to take?".

The perfect colleagues.` },
  tazza: { label: "Coffee mug", title: "COFFEE.EXE", text:
`System process. Priority: maximum.

Without this mug no program compiles,
no bug gets found, no meeting gets endured.

> coffee: low level
> refill in progress..._` },
  giradischi: { label: "Turntable and speakers", title: "TURNTABLE", text:
`Platter, tonearm, stylus. 33 rpm.

The ritual never changes: slide the record out, blow off
the dust, lower the arm and wait for that crackle
before the first note.

No streaming service sounds like this.` },
  vinili: { label: "The vinyl collection", title: "VINYL COLLECTION", text:
`Joy Division. The Beatles. Led Zeppelin. And many more.

Every sleeve is a chapter of my life, every groove a memory.
Manchester post-punk, the most famous zebra crossing
in the world, the most rock'n'roll airship in history.

The collection is never finished.
That's the whole point.` },
  io: { label: "About me", title: "ABOUT ME", text:
`> user identified: Alessio Paolucci (Alexyr)

Nostalgic tech enthusiast. Developer, into vinyl records,
science fiction and fantasy worlds. I write code by day and
listen to Pink Floyd at night (and often by day too).

This room is my world: click the objects
to discover the rest.

[ write something more about yourself here ]` },
  targhetta: { label: "Alessio Paolucci (Alexyr)", title: "ALESSIO PAOLUCCI // ALEXYR", text:
`> whoami
alexyr

> cat role.txt
Nostalgic tech enthusiast.

A brass nameplate on a desk full of stuff:
the name is there to remind visitors whose mess this is.

If you want to know who's behind it, click on me.` }
};

const UI = {
  it: { help: "[ ? ] mostra oggetti", hint: "clic sul testo = mostra tutto · ESC = chiudi", close: "Chiudi",
        room: "La mia stanza", intro: INTRO_LINES, flagTip: "Italiano", current: " (lingua attuale)" },
  en: { help: "[ ? ] show objects", hint: "click the text = show all · ESC = close", close: "Close",
        room: "My room", intro: ["Wake up...", "The room has found you.", "Follow the objects."],
        flagTip: "English", current: " (current language)" }
};

/* ===================== da qui in giù: il motore ===================== */
const svgNS = "http://www.w3.org/2000/svg";
const g = document.getElementById("hotspots");
const tip = document.getElementById("tip");
const overlay = document.getElementById("overlay");
const titleEl = document.getElementById("title");
const textEl = document.getElementById("text");
const pathEl = document.getElementById("path");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastFocus = null;

if (location.search.includes("debug")) document.body.classList.add("show-all");

/* --- Lingua --- */
function store(k, v) { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch (e) { return null; } }
const urlLang = new URLSearchParams(location.search).get("lang");
let lang = ["it", "en"].includes(urlLang) ? urlLang
         : store("lang") || ((navigator.language || "it").toLowerCase().startsWith("it") ? "it" : "en");
if (!["it", "en"].includes(lang)) lang = "it";
const tr = o => (lang === "en" && EN[o.id]) ? EN[o.id] : o;
const hotEls = {};

OBJECTS.forEach(o => {
  const a = document.createElementNS(svgNS, "g");
  a.setAttribute("class", "hot");
  a.setAttribute("tabindex", "0");
  a.setAttribute("role", "button");
  hotEls[o.id] = a;
  o.shapes.forEach(d => {
    const p = document.createElementNS(svgNS, "path");
    p.setAttribute("d", d);
    a.appendChild(p);
  });
  a.addEventListener("click", () => openPopup(o, a));
  a.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPopup(o, a); } });
  a.addEventListener("mousemove", e => {
    tip.textContent = "> " + tr(o).label;
    tip.style.display = "block";
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px"; tip.style.top = (e.clientY + 16) + "px";
  });
  a.addEventListener("mouseleave", () => tip.style.display = "none");
  g.appendChild(a);
});

/* --- Effetto macchina da scrivere --- */
let typing = null;
function typeText(str) {
  clearInterval(typing);
  textEl.innerHTML = "";
  const node = document.createTextNode("");
  const cur = document.createElement("span"); cur.className = "cursor"; cur.innerHTML = "&nbsp;";
  textEl.append(node, cur);
  if (reduceMotion) { node.data = str; return; }
  let i = 0;
  typing = setInterval(() => {
    i += 2;
    node.data = str.slice(0, i);
    if (i >= str.length) clearInterval(typing);
  }, 18);
  textEl.onclick = () => { clearInterval(typing); node.data = str; };
}

function scramble(el, final) {
  if (reduceMotion) { el.textContent = final; return; }
  const chars = "アイウエオカキクケコｱｲｳｴｵ01ΣΞ#$%&";
  let n = 0;
  const t = setInterval(() => {
    el.textContent = final.split("").map((c, k) =>
      k < n || c === " " ? c : chars[Math.floor(Math.random() * chars.length)]).join("");
    n += 1;
    if (n > final.length) clearInterval(t);
  }, 30);
}

function openPopup(o, el) {
  lastFocus = el;
  el.classList.add("visited");
  tip.style.display = "none";
  pathEl.textContent = "root@stanza:~/" + o.id + ".dat";
  scramble(titleEl, tr(o).title);
  typeText(tr(o).text);
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  startRain();
  document.getElementById("close").focus();
}
function closePopup() {
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");
  clearInterval(typing);
  stopRain();
  if (lastFocus) lastFocus.focus();
}
document.getElementById("close").onclick = closePopup;
overlay.addEventListener("click", e => { if (e.target === overlay || e.target.id === "rain") closePopup(); });
addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("open")) closePopup(); });

/* --- Pioggia digitale --- */
const canvas = document.getElementById("rain");
const ctx = canvas.getContext("2d");
const glyphs = "アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789";
let drops = [], rainId = null, fs = 16;
function sizeRain() {
  canvas.width = innerWidth; canvas.height = innerHeight;
  const cols = Math.ceil(canvas.width / fs);
  drops = Array.from({ length: cols }, () => Math.random() * -50);
}
function drawRain() {
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = fs + "px monospace";
  drops.forEach((y, i) => {
    const ch = glyphs[Math.floor(Math.random() * glyphs.length)];
    ctx.fillStyle = Math.random() > 0.975 ? "#ccffd8" : "#00ff41";
    ctx.fillText(ch, i * fs, y * fs);
    drops[i] = (y * fs > canvas.height && Math.random() > 0.975) ? 0 : y + 1;
  });
}
function startRain() {
  sizeRain();
  ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (reduceMotion) return;
  let last = 0;
  const loop = t => { if (t - last > 45) { drawRain(); last = t; } rainId = requestAnimationFrame(loop); };
  rainId = requestAnimationFrame(loop);
}
function stopRain() { cancelAnimationFrame(rainId); rainId = null; }
addEventListener("resize", () => { if (rainId) sizeRain(); });

function applyLang() {
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById("help").textContent = u.help;
  document.getElementById("hint").textContent = u.hint;
  document.getElementById("close").setAttribute("aria-label", u.close);
  document.getElementById("svg").setAttribute("aria-label", u.room);
  document.title = u.room;
  OBJECTS.forEach(o => hotEls[o.id].setAttribute("aria-label", tr(o).label));
  document.querySelectorAll("#lang button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
}
document.querySelectorAll("#lang button").forEach(b => {
  const l = b.dataset.lang;
  b.addEventListener("click", () => { lang = l; store("lang", l); applyLang(); showTip(b, l); });
  b.addEventListener("mouseenter", () => showTip(b, l));
  b.addEventListener("focus", () => showTip(b, l));
  b.addEventListener("mouseleave", () => tip.style.display = "none");
  b.addEventListener("blur", () => tip.style.display = "none");
});
function showTip(b, l) {
  tip.textContent = "> " + UI[l].flagTip + (l === lang ? UI[l].current : "");
  tip.style.display = "block";
  const r = b.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - tip.offsetWidth - 8)) + "px";
  tip.style.top = (r.bottom + 8) + "px";
}
applyLang();

/* --- Pulsante "mostra oggetti" --- */
document.getElementById("help").onclick = () => {
  document.body.classList.add("show-all");
  setTimeout(() => { if (!location.search.includes("debug")) document.body.classList.remove("show-all"); }, 2500);
};

/* --- Intro --- */
const intro = document.getElementById("intro");
const introText = document.getElementById("introText");
function endIntro() { intro.classList.add("hide"); setTimeout(() => intro.remove(), 900); }
intro.addEventListener("click", endIntro);
(async function runIntro() {
  if (reduceMotion || location.search.includes("debug")) return endIntro();
  for (const line of UI[lang].intro) {
    if (!intro.isConnected) return;
    for (let i = 0; i <= line.length; i++) {
      introText.innerHTML = line.slice(0, i) + '<span class="cursor">&nbsp;</span>';
      await new Promise(r => setTimeout(r, 70));
    }
    await new Promise(r => setTimeout(r, 900));
  }
  endIntro();
})();

/* Sfondo sfocato: riusa l'immagine della scena */
document.getElementById("bgfill").style.backgroundImage =
  'url("' + document.querySelector("#svg image").getAttribute("href") + '")';

/* Centra la scena sugli schermi stretti */
addEventListener("load", () => {
  const s = document.getElementById("scene");
  scrollTo((s.offsetWidth - innerWidth) / 2, (s.offsetHeight - innerHeight) / 2);
});
</script>
</body>
